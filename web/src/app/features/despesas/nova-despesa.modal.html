<div class="fixed inset-0 z-50 flex items-center justify-center overflow-y-auto bg-carvao/40 p-4 backdrop-blur-[2px]" (click)="cancelar.emit()">

  <div
    role="dialog"
    aria-modal="true"
    aria-labelledby="titulo-nova-despesa"
    (click)="$event.stopPropagation()"
    class="animate-aparecer motion-reduce:animate-none w-full max-w-md rounded-2xl bg-creme p-6 shadow-[0_30px_80px_-20px_rgba(74,71,68,0.45)] sm:p-8"
  >
    <div class="flex items-center justify-between">
      <h2 id="titulo-nova-despesa" class="font-titulo text-2xl text-carvao">Nova despesa</h2>
      <button type="button" (click)="cancelar.emit()" aria-label="Fechar" class="grid h-8 w-8 place-items-center rounded-full text-carvao/70 transition hover:bg-areia hover:text-carvao">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>

    <form (submit)="enviar($event)" class="mt-6 space-y-4" novalidate>

      <label class="block text-sm text-carvao/80">
        Descrição
        <input #campoDescricao type="text" maxlength="100" placeholder="Ex.: Buffet"
               [value]="descricao()" (input)="descricao.set(valor($event))"
               class="mt-1.5 w-full rounded-xl border border-bege/70 bg-white/50 px-4 py-3 text-[15px] text-carvao outline-none focus:ring-2 focus:ring-dourado/20" />
      </label>

      <label class="block text-sm text-carvao/80">
        Categoria
        <select [value]="categoria()" (change)="categoria.set(valor($event))"
                class="mt-1.5 w-full rounded-xl border border-bege/70 bg-white/50 px-4 py-3 text-[15px] text-carvao outline-none focus:ring-2 focus:ring-dourado/20">
          <option value="">Selecione</option>
          @for (item of categorias; track item) {
            <option [value]="item">{{ item }}</option>
          }
        </select>
      </label>

      <div class="grid grid-cols-[1fr_auto] items-end gap-4">
        <label class="block text-sm text-carvao/80">
          Valor total
          <span class="mt-1.5 flex items-center gap-2 rounded-xl border border-bege/70 bg-white/50 px-4 py-3 focus-within:ring-2 focus-within:ring-dourado/20">
            <span class="text-[15px] text-carvao/70">R$</span>
            <input type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0,00"
                   [value]="valorTotal()" (input)="valorTotal.set(valor($event))"
                   class="w-full bg-transparent text-[15px] text-carvao outline-none" />
          </span>
        </label>

        <div class="flex items-center gap-3 pb-3">
          <span id="rotulo-parcelar" class="text-sm text-carvao/80">Parcelar?</span>
          <button type="button" role="switch" aria-labelledby="rotulo-parcelar" [attr.aria-checked]="parcelar()"
                  (click)="parcelar.set(!parcelar())"
                  [class]="parcelar() ? 'bg-dourado' : 'bg-bege'"
                  class="relative h-6 w-11 shrink-0 rounded-full transition-colors focus:outline-none focus-visible:ring-4 focus-visible:ring-dourado/30">
            <span class="absolute left-0.5 top-0.5 h-5 w-5 rounded-full bg-white shadow transition-transform" [class.translate-x-5]="parcelar()"></span>
          </button>
        </div>
      </div>

      <div class="grid gap-4 sm:grid-cols-2">
        @if (parcelar()) {
          <label class="animate-aparecer motion-reduce:animate-none block text-sm text-carvao/80">
            Nº de parcelas
            <input type="number" min="2" max="60" step="1" inputmode="numeric"
                   [value]="numParcelas()" (input)="numParcelas.set(valor($event))"
                   class="mt-1.5 w-full rounded-xl border border-bege/70 bg-white/50 px-4 py-3 text-[15px] text-carvao outline-none focus:ring-2 focus:ring-dourado/20" />
          </label>
        }
        <label class="block text-sm text-carvao/80" [class]="parcelar() ? '' : 'sm:col-span-2'">
          {{ parcelar() ? '1º vencimento' : 'Vencimento' }}
          <input type="date" [value]="primeiroVencimento()" (input)="primeiroVencimento.set(valor($event))"
                 class="mt-1.5 w-full rounded-xl border border-bege/70 bg-white/50 px-4 py-3 text-[15px] text-carvao outline-none focus:ring-2 focus:ring-dourado/20" />
        </label>
      </div>

      @if (parcelasGeradas().length) {
        <div class="animate-aparecer motion-reduce:animate-none rounded-xl bg-areia/70 p-4 text-sm text-carvao">
          <p class="font-medium">Parcelas geradas:</p>
          <ul class="mt-2 max-h-28 space-y-0.5 overflow-y-auto text-carvao/80">
            @for (parcela of parcelasGeradas(); track parcela.numero) {
              <li>{{ moeda(parcela.valor) }} em {{ data(parcela.vencimento) }}</li>
            }
          </ul>
        </div>
      }

      @if (erroLocal() ?? erro) {
        <p class="text-sm text-atrasado" role="alert">{{ erroLocal() ?? erro }}</p>
      }

      <div class="flex items-center justify-end gap-3 pt-2">
        <button type="button" (click)="cancelar.emit()" [disabled]="salvando"
                class="rounded-full border border-bege px-6 py-3 text-[15px] text-carvao transition hover:bg-areia disabled:opacity-50">
          Cancelar
        </button>
        <button type="submit" [disabled]="salvando"
                class="rounded-full bg-dourado px-8 py-3 text-[15px] font-medium text-white shadow-[0_10px_25px_-10px_rgba(187,139,68,0.8)] transition hover:opacity-90 focus:outline-none focus-visible:ring-4 focus-visible:ring-dourado/30 disabled:opacity-50">
          {{ salvando ? 'Salvando...' : 'Salvar' }}
        </button>
      </div>
    </form>
  </div>
</div>
